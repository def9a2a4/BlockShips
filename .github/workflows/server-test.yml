name: Server Integration Test

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # minecraft: ['1.21.1', '1.21.4', '1.21.8', '1.21.10', '1.21.11']
        minecraft: ['1.21.1', '1.21.11']
        server: ['paper', 'purpur']

    name: ${{ matrix.server }} ${{ matrix.minecraft }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install bot dependencies
        run: make test-bot-install

      - name: Download plugin JAR
        uses: actions/download-artifact@v4
        with:
          name: BlockShips
          path: test-server/plugins/

      - name: Setup and run test server with bot
        run: |
          make test-server-setup
          make test-server-download SERVER_VARIANT=${{ matrix.server }} MINECRAFT_VERSION=${{ matrix.minecraft }}
          make test-server-with-bot MINECRAFT_VERSION=${{ matrix.minecraft }}

      - name: Check for errors
        if: always()
        run: |
          if [ -f test-server/errors.log ]; then
            echo "========== ERRORS =========="
            cat test-server/errors.log
            exit 1
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.server }}-${{ matrix.minecraft }}
          path: |
            test-server/server.log
            test-server/errors.log
