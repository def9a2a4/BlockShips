name: Crash and Upgrade Tests

on:
  workflow_call:
  workflow_dispatch:

# Paper 1.21.11 only: both scripts drive the server with the mineflayer bot, which has no 26.x data yet.
# Each script builds BlockShips itself (the upgrade test also builds 0.0.17 from its tag), so these jobs
# need Gradle, and only the defCoreLib jar from the build job.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        script: [crash-test, upgrade-test]
    name: ${{ matrix.script }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the upgrade test checks out the v0.0.17 tag in a worktree

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install bot dependencies
        run: make test-bot-install

      - name: Download defCoreLib JAR
        uses: actions/download-artifact@v4
        with:
          name: defCoreLib
          path: .download-cache/plugins/

      - name: Run ${{ matrix.script }}
        run: |
          jar=$(ls "$PWD"/.download-cache/plugins/defCoreLib-*.jar | grep -v -- '-plain' | head -1)
          [ -n "$jar" ] || { echo "no defCoreLib jar in the downloaded artifact"; exit 1; }
          JAVA=$(command -v java) test-bot/${{ matrix.script }}.sh "$jar"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.script }}
          path: |
            test-bot/crash-server.log
            test-bot/crash-test-results.all
            test-bot/upgrade-*-server.log
            test-server/server.log
          if-no-files-found: ignore
