<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ship Stats Toy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
        }
        .controls {
            background: #16213e;
            padding: 20px;
            border-radius: 12px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        h2 {
            font-size: 18px;
            color: #4cc9f0;
            border-bottom: 1px solid #4cc9f033;
            padding-bottom: 8px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .slider-row label {
            width: 70px;
            font-size: 14px;
        }
        .slider-row input[type="range"] {
            flex: 1;
            accent-color: #4cc9f0;
        }
        .slider-row .value {
            width: 35px;
            text-align: right;
            font-family: monospace;
            color: #4cc9f0;
        }
        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #4cc9f055;
            background: #0f3460;
            color: #eee;
            font-size: 14px;
            cursor: pointer;
        }
        select:hover {
            border-color: #4cc9f0;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .checkbox-row input {
            width: 18px;
            height: 18px;
            accent-color: #f72585;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
        }
        .stat {
            background: #0f3460;
            padding: 8px 10px;
            border-radius: 6px;
        }
        .stat-label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
        }
        .stat-value {
            font-family: monospace;
            font-size: 16px;
            color: #4cc9f0;
        }
        .stat-value.good { color: #4ade80; }
        .stat-value.bad { color: #f87171; }
        .stat-value.neutral { color: #fbbf24; }
        .canvas-wrapper {
            position: relative;
        }
        canvas {
            background: #0a1628;
            border-radius: 12px;
            display: block;
        }
        .instructions {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 8px;
        }
        .method-desc {
            font-size: 12px;
            color: #888;
            padding: 10px;
            background: #0f3460;
            border-radius: 6px;
            line-height: 1.5;
        }
        .method-desc code {
            color: #4cc9f0;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <h2>Calculation Method</h2>
            <div class="control-group">
                <select id="method">
                    <option value="A">A: Power-to-Weight Ratio</option>
                    <option value="B">B: Diminishing Returns</option>
                    <option value="C">C: Composition Percentage</option>
                    <option value="D">D: Hybrid</option>
                </select>
                <div class="method-desc" id="methodDesc"></div>
            </div>

            <h2>Ship Composition</h2>
            <div class="control-group">
                <div class="slider-row">
                    <label>Wool</label>
                    <input type="range" id="wool" min="0" max="100" value="10">
                    <span class="value" id="woolVal">10</span>
                </div>
                <div class="slider-row">
                    <label>Banner</label>
                    <input type="range" id="banner" min="0" max="50" value="5">
                    <span class="value" id="bannerVal">5</span>
                </div>
                <div class="slider-row">
                    <label>Planks</label>
                    <input type="range" id="planks" min="0" max="200" value="50">
                    <span class="value" id="planksVal">50</span>
                </div>
                <div class="slider-row">
                    <label>Obsidian</label>
                    <input type="range" id="obsidian" min="0" max="50" value="2">
                    <span class="value" id="obsidianVal">2</span>
                </div>
                <div class="slider-row">
                    <label>Engines</label>
                    <input type="range" id="engines" min="0" max="10" value="2">
                    <span class="value" id="enginesVal">2</span>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="fueled" checked>
                    <label for="fueled">Engines Fueled</label>
                </div>
            </div>

            <h2>Ship Stats</h2>
            <div class="stats-grid">
                <div class="stat">
                    <div class="stat-label">Total Mass</div>
                    <div class="stat-value" id="massVal">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Blocks</div>
                    <div class="stat-value" id="blocksVal">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Sail Points</div>
                    <div class="stat-value" id="sailVal">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Engine Points</div>
                    <div class="stat-value" id="engineVal">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Total Power</div>
                    <div class="stat-value" id="powerVal">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Dimensions</div>
                    <div class="stat-value" id="dimsVal">0x0x0</div>
                </div>
            </div>

            <h2>Multipliers</h2>
            <div class="stats-grid">
                <div class="stat">
                    <div class="stat-label">Speed</div>
                    <div class="stat-value" id="speedMult">1.00x</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Acceleration</div>
                    <div class="stat-value" id="accelMult">1.00x</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Rotation Spd</div>
                    <div class="stat-value" id="rotMult">1.00x</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Rot Accel</div>
                    <div class="stat-value" id="rotAccelMult">1.00x</div>
                </div>
            </div>

            <h2>World</h2>
            <div class="control-group">
                <div class="slider-row">
                    <label>Density</label>
                    <input type="range" id="threshold" min="30" max="90" value="60">
                    <span class="value" id="thresholdVal">60%</span>
                </div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="canvas" width="700" height="700"></canvas>
            <div class="instructions">WASD to drive | Space to brake</div>
        </div>
    </div>

    <script>
        // Block masses from blocks.yml
        const BLOCK_MASS = {
            wool: 1,
            banner: 1,
            planks: 2,
            obsidian: 10,
            engine: 3
        };

        // Sail/engine points
        const SAIL_POINTS = {
            wool: 1,
            banner: 3
        };
        const ENGINE_POINTS = 10;

        // Base ship stats
        const BASE_STATS = {
            maxSpeed: 0.55,
            acceleration: 0.02,
            rotationSpeed: 1.0,        // lowered max rotation
            rotationAcceleration: 0.5  // increased base rotation accel
        };
        const BASE_MASS = 100; // reference mass for rotation penalty

        // Per-stat influence (sails affect rotation less)
        const SAIL_INFLUENCE = {
            maxSpeed: 1.0,
            acceleration: 0.5,
            rotationSpeed: 0.3,
            rotationAcceleration: 0.3
        };
        const ENGINE_INFLUENCE = {
            maxSpeed: 1.0,
            acceleration: 1.0,
            rotationSpeed: 0.7,
            rotationAcceleration: 0.7
        };

        // Method descriptions
        const METHOD_DESC = {
            A: '<b>Power-to-Weight Ratio</b><br><code>mult = 0.1 + (power/mass) * 20</code><br>Intuitive: more sails relative to mass = faster',
            B: '<b>Diminishing Returns</b><br><code>mult = 0.1 + sqrt(sails)*0.06 + engines*0.02 - sqrt(mass)*0.008</code><br>Prevents sail stacking exploits',
            C: '<b>Composition %</b><br><code>mult = 0.1 + (sails/mass)*4 + (engines/mass)*8</code><br>Rewards efficient ship design',
            D: '<b>Hybrid</b><br><code>mult = 0.1 + (sqrt(sails)*2 + engines) / sqrt(mass) * 0.08</code><br>Combines ratio with diminishing returns'
        };

        // Perlin noise implementation
        class Perlin {
            constructor() {
                this.p = [];
                for (let i = 0; i < 256; i++) this.p[i] = Math.floor(Math.random() * 256);
                for (let i = 0; i < 256; i++) this.p[256 + i] = this.p[i];
            }
            fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
            lerp(a, b, t) { return a + t * (b - a); }
            grad(hash, x, y) {
                const h = hash & 3;
                const u = h < 2 ? x : y;
                const v = h < 2 ? y : x;
                return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
            }
            noise(x, y) {
                const X = Math.floor(x) & 255;
                const Y = Math.floor(y) & 255;
                x -= Math.floor(x);
                y -= Math.floor(y);
                const u = this.fade(x);
                const v = this.fade(y);
                const A = this.p[X] + Y;
                const B = this.p[X + 1] + Y;
                return this.lerp(
                    this.lerp(this.grad(this.p[A], x, y), this.grad(this.p[B], x - 1, y), u),
                    this.lerp(this.grad(this.p[A + 1], x, y - 1), this.grad(this.p[B + 1], x - 1, y - 1), u),
                    v
                );
            }
        }

        // Game state
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const perlin = new Perlin();

        let ship = {
            x: 350,
            y: 350,
            angle: 0,
            speed: 0,
            rotSpeed: 0
        };

        let keys = {};
        let obstacles = [];
        let stats = { ...BASE_STATS };

        // Generate obstacles on a grid using Perlin noise
        const GRID_SIZE = 5; // pixels per grid cell (matches ship BLOCK_PIXEL_SIZE)
        const NOISE_SCALE = 0.03; // higher = smaller/more frequent islands

        function generateObstacles() {
            obstacles = [];
            const threshold = parseInt(document.getElementById('threshold').value) / 100;

            const cols = Math.ceil(canvas.width / GRID_SIZE);
            const rows = Math.ceil(canvas.height / GRID_SIZE);

            for (let gx = 0; gx < cols; gx++) {
                for (let gy = 0; gy < rows; gy++) {
                    // Sample noise at grid position
                    const n = (perlin.noise(gx * NOISE_SCALE, gy * NOISE_SCALE) + 1) / 2;

                    if (n > threshold) {
                        // Color varies based on noise value (gives natural variation)
                        const intensity = (n - threshold) / (1 - threshold);
                        const hue = 20 + intensity * 30; // brown to tan
                        const sat = 20 + intensity * 20;
                        const light = 15 + intensity * 20 + (gx * 3 + gy * 7) % 10;

                        obstacles.push({
                            x: gx * GRID_SIZE,
                            y: gy * GRID_SIZE,
                            size: GRID_SIZE,
                            color: `hsl(${hue}, ${sat}%, ${light}%)`
                        });
                    }
                }
            }
        }

        // Calculate multiplier based on method
        // Base of 0.1 means ships without sails/engines are very slow
        function calculateMultiplier(method, sailPoints, enginePoints, mass) {
            const power = sailPoints + enginePoints;
            let mult;

            switch (method) {
                case 'A': // Power-to-Weight Ratio
                    mult = 0.1 + (power / mass) * 20;  // reduced from 50
                    break;
                case 'B': // Diminishing Returns
                    const sailBonus = Math.sqrt(sailPoints) * 0.06;  // reduced
                    const engineBonus = enginePoints * 0.02;  // reduced
                    const massPenalty = Math.sqrt(mass) * 0.008;
                    mult = 0.1 + sailBonus + engineBonus - massPenalty;
                    break;
                case 'C': // Composition Percentage
                    const sailRatio = sailPoints / mass;
                    const engineRatio = enginePoints / mass;
                    mult = 0.1 + sailRatio * 4.0 + engineRatio * 8.0;  // reduced
                    break;
                case 'D': // Hybrid
                    const effSails = Math.sqrt(sailPoints) * 2;  // reduced
                    const effEngines = enginePoints;
                    const hybridPower = effSails + effEngines;
                    mult = 0.1 + (hybridPower / Math.sqrt(mass)) * 0.08;  // reduced
                    break;
            }

            return Math.max(0.1, Math.min(1.5, mult));
        }

        // Calculate per-stat multipliers with influence weighting
        function calculateStats() {
            const wool = parseInt(document.getElementById('wool').value);
            const banner = parseInt(document.getElementById('banner').value);
            const planks = parseInt(document.getElementById('planks').value);
            const obsidian = parseInt(document.getElementById('obsidian').value);
            const engines = parseInt(document.getElementById('engines').value);
            const fueled = document.getElementById('fueled').checked;
            const method = document.getElementById('method').value;

            // Calculate mass
            const mass =
                wool * BLOCK_MASS.wool +
                banner * BLOCK_MASS.banner +
                planks * BLOCK_MASS.planks +
                obsidian * BLOCK_MASS.obsidian +
                engines * BLOCK_MASS.engine;

            // Calculate points
            const sailPoints = wool * SAIL_POINTS.wool + banner * SAIL_POINTS.banner;
            const enginePoints = fueled ? engines * ENGINE_POINTS : 0;
            const totalPower = sailPoints + enginePoints;

            // Ensure minimum mass
            const effectiveMass = Math.max(1, mass);

            // Calculate per-stat multipliers
            const mults = {};
            for (const stat of Object.keys(BASE_STATS)) {
                const sailInfluence = SAIL_INFLUENCE[stat];
                const engineInfluence = ENGINE_INFLUENCE[stat];
                const effSailPts = sailPoints * sailInfluence;
                const effEnginePts = enginePoints * engineInfluence;
                mults[stat] = calculateMultiplier(method, effSailPts, effEnginePts, effectiveMass);
            }

            // Apply to stats
            // Rotation gets additional mass penalty - large ships turn slower
            const massFactor = Math.sqrt(effectiveMass / BASE_MASS);
            stats = {
                maxSpeed: BASE_STATS.maxSpeed * mults.maxSpeed,
                acceleration: BASE_STATS.acceleration * mults.acceleration,
                rotationSpeed: BASE_STATS.rotationSpeed * mults.rotationSpeed / massFactor,
                rotationAcceleration: BASE_STATS.rotationAcceleration * mults.rotationAcceleration / massFactor
            };

            // Calculate block count and dimensions (1:2:6 ratio)
            const totalBlocks = wool + banner + planks + obsidian + engines;
            let dims = '0x0x0';
            if (totalBlocks > 0) {
                const h = Math.pow(totalBlocks / 12, 1/3);
                dims = `${h.toFixed(1)}x${(2*h).toFixed(1)}x${(6*h).toFixed(1)}`;
            }

            // Update UI
            document.getElementById('massVal').textContent = mass;
            document.getElementById('blocksVal').textContent = totalBlocks;
            document.getElementById('sailVal').textContent = sailPoints;
            document.getElementById('engineVal').textContent = enginePoints;
            document.getElementById('powerVal').textContent = totalPower;
            document.getElementById('dimsVal').textContent = dims;

            updateMultDisplay('speedMult', mults.maxSpeed, stats.maxSpeed);
            updateMultDisplay('accelMult', mults.acceleration, stats.acceleration);
            updateMultDisplay('rotMult', mults.rotationSpeed, stats.rotationSpeed);
            updateMultDisplay('rotAccelMult', mults.rotationAcceleration, stats.rotationAcceleration);

            document.getElementById('methodDesc').innerHTML = METHOD_DESC[method];

            return { wool, banner, planks, obsidian, engines, mass };
        }

        function updateMultDisplay(id, mult, actual) {
            const el = document.getElementById(id);
            el.textContent = `${mult.toFixed(2)}x (${actual.toFixed(2)})`;
            el.className = 'stat-value';
            if (mult >= 1.2) el.classList.add('good');
            else if (mult <= 0.6) el.classList.add('bad');
            else if (mult < 1.0) el.classList.add('neutral');
        }

        // Calculate ship visual size from block count
        // Shape is 1:2:6 (height:width:length), viewed from top we see width x length
        // volume = height * width * length = h * 2h * 6h = 12h³
        // h = (volume/12)^(1/3), width = 2h, length = 6h
        const BLOCK_PIXEL_SIZE = 5; // pixels per block edge
        function getShipSize(composition) {
            const totalBlocks = composition.wool + composition.banner +
                               composition.planks + composition.obsidian + composition.engines;
            if (totalBlocks === 0) {
                return { width: 0, length: 0, volume: 0 };
            }
            // Solve for h from volume = 12h³
            const h = Math.pow(totalBlocks / 12, 1/3);
            const widthInBlocks = 2 * h;
            const lengthInBlocks = 6 * h;
            // Convert to pixels - no minimums, exact size
            return {
                width: widthInBlocks * BLOCK_PIXEL_SIZE,
                length: lengthInBlocks * BLOCK_PIXEL_SIZE,
                volume: totalBlocks
            };
        }

        // Physics update
        function update() {
            const composition = calculateStats();

            // Rotation
            if (keys['a'] || keys['ArrowLeft']) {
                ship.rotSpeed -= stats.rotationAcceleration;
            }
            if (keys['d'] || keys['ArrowRight']) {
                ship.rotSpeed += stats.rotationAcceleration;
            }

            // Clamp and apply rotation
            ship.rotSpeed = Math.max(-stats.rotationSpeed, Math.min(stats.rotationSpeed, ship.rotSpeed));
            ship.angle += ship.rotSpeed * (Math.PI / 180);

            // Rotation friction
            ship.rotSpeed *= 0.92;

            // Acceleration
            if (keys['w'] || keys['ArrowUp']) {
                ship.speed += stats.acceleration;
            }
            if (keys['s'] || keys['ArrowDown']) {
                ship.speed -= stats.acceleration * 0.5; // Reverse is slower
            }

            // Brake
            if (keys[' ']) {
                ship.speed *= 0.9;
            }

            // Clamp speed
            ship.speed = Math.max(-stats.maxSpeed * 0.3, Math.min(stats.maxSpeed, ship.speed));

            // Apply movement
            ship.x += Math.cos(ship.angle) * ship.speed * 10;
            ship.y += Math.sin(ship.angle) * ship.speed * 10;

            // Friction
            ship.speed *= 0.98;

            // World wrap
            if (ship.x < 0) ship.x = canvas.width;
            if (ship.x > canvas.width) ship.x = 0;
            if (ship.y < 0) ship.y = canvas.height;
            if (ship.y > canvas.height) ship.y = 0;

            // Simple collision with obstacles (rectangular blocks)
            const shipSize = getShipSize(composition);
            const shipRadius = (shipSize.width + shipSize.length) / 4;

            for (const obs of obstacles) {
                // Find closest point on obstacle rectangle to ship center
                const closestX = Math.max(obs.x, Math.min(ship.x, obs.x + obs.size));
                const closestY = Math.max(obs.y, Math.min(ship.y, obs.y + obs.size));

                const dx = ship.x - closestX;
                const dy = ship.y - closestY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < shipRadius && dist > 0) {
                    // Push ship away from obstacle
                    const push = (shipRadius - dist) / dist;
                    ship.x += dx * push * 0.5;
                    ship.y += dy * push * 0.5;
                    ship.speed *= 0.7;
                } else if (dist === 0) {
                    // Ship center is inside block, push out
                    ship.x += (Math.random() - 0.5) * 10;
                    ship.y += (Math.random() - 0.5) * 10;
                    ship.speed *= 0.5;
                }
            }

            return composition;
        }

        // Render
        function render(composition) {
            ctx.fillStyle = '#0a1628';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw obstacles as blocks
            for (const obs of obstacles) {
                // Main block fill
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.size, obs.size);

                // Highlight (top-left edges)
                ctx.fillStyle = `rgba(255, 255, 255, 0.15)`;
                ctx.fillRect(obs.x, obs.y, obs.size, 2);
                ctx.fillRect(obs.x, obs.y, 2, obs.size);

                // Shadow (bottom-right edges)
                ctx.fillStyle = `rgba(0, 0, 0, 0.3)`;
                ctx.fillRect(obs.x, obs.y + obs.size - 2, obs.size, 2);
                ctx.fillRect(obs.x + obs.size - 2, obs.y, 2, obs.size);
            }

            // Draw ship
            const shipSize = getShipSize(composition);
            ctx.save();
            ctx.translate(ship.x, ship.y);
            ctx.rotate(ship.angle);

            // Simple rectangle ship - length x width, no frills
            const w = shipSize.width;
            const l = shipSize.length;

            if (l > 0 && w > 0) {
                // Hull - simple rectangle
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(-l/2, -w/2, l, w);

                // Border
                ctx.strokeStyle = '#654321';
                ctx.lineWidth = 1;
                ctx.strokeRect(-l/2, -w/2, l, w);

                // Direction indicator (front of ship)
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.moveTo(l/2, 0);
                ctx.lineTo(l/2 - 5, -3);
                ctx.lineTo(l/2 - 5, 3);
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();

            // Speed indicator
            ctx.fillStyle = '#4cc9f0';
            ctx.font = '12px monospace';
            ctx.fillText(`Speed: ${(ship.speed * 100).toFixed(1)}`, 10, 20);
        }

        // Game loop
        function gameLoop() {
            const composition = update();
            render(composition);
            requestAnimationFrame(gameLoop);
        }

        // Input handling
        document.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
            }
        });
        document.addEventListener('keyup', e => {
            keys[e.key.toLowerCase()] = false;
        });

        // Slider value displays
        for (const id of ['wool', 'banner', 'planks', 'obsidian', 'engines']) {
            const slider = document.getElementById(id);
            const display = document.getElementById(id + 'Val');
            slider.addEventListener('input', () => {
                display.textContent = slider.value;
            });
        }

        // Threshold slider - regenerates obstacles
        const thresholdSlider = document.getElementById('threshold');
        const thresholdDisplay = document.getElementById('thresholdVal');
        thresholdSlider.addEventListener('input', () => {
            thresholdDisplay.textContent = thresholdSlider.value + '%';
            generateObstacles();
        });

        // Initialize
        generateObstacles();
        calculateStats();
        gameLoop();

        // Regenerate obstacles button (double-click canvas)
        canvas.addEventListener('dblclick', () => {
            generateObstacles();
        });
    </script>
</body>
</html>
