# The defCoreLib commit CI builds against. ONE consumer: .github/workflows/checks.yml scrapes this
# line, clones def9a2a4/defCoreLib at that ref, builds it, and passes the jar to Gradle.
#
# LOCAL BUILDS IGNORE IT — `make build` builds the sibling ../defCoreLib checkout and compiles and
