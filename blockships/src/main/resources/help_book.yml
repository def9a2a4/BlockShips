# Captain's Manual - Help book content
# Bundled in the jar, NOT copied to the user's data folder.
# Used for both the ship wheel menu help button and the craftable Captain's Manual.
# Set content to null for dynamic content (filled at runtime).
#
# KEEP EACH content UNDER ~200 CHARACTERS. HelpBookContent budgets 12 lines per page at 20 chars per
# line; a section costing more than 12 lines by itself is written to a fresh page and then overflows
# it, because there is no intra-section split. The tail is silently clipped by the client.
#
# Do NOT put & colour codes here. The renderer applies its own styling and never translates them, so
# they render as literal text.
#
# NOTE: the craftable Captain's Manual bakes these pages in at craft time. Editing this file changes
# the wheel-menu book immediately, but players holding an old manual must re-craft it.

title: "Captain's Manual"
author: "BlockShips"

sections:
  - title: "Controls"
    content: null  # Filled at runtime via SteerPacketCompat

  - title: "Getting Started"
    content: "Place wheel on your build, open this menu by right-clicking the wheel, click the boat to assemble."

  - title: "Riding"
    content: "Right-click ship or seat to board. Sneak to exit."

  - title: "Menu & Disassembly"
    content: "Right-click the ship's wheel, or sneak + right-click anywhere on the ship. Click the pickaxe to disassemble."

  - title: "Cannons"
    content: "Dispenser + obsidian behind it. Right-click the obsidian to fire, or use the fireball in the menu."

  - title: "Functionality"
    content: "Chests, barrels, and other containers work on ships. Attach leads to fences to bring mobs or boats along. Stairs work as extra seats for players."

  - title: "Weight & Buoyancy"
    content: "Wood/wool = light, metals = heavy. Glowstone/end rods = lighter than air, so enough of them makes an airship. Click the book to detect your ship and see its stats."

  - title: "Sails"
    content: "Wool 3 pts, banner 7, large banner 20, huge banner 50. Sails raise top speed and, once you are moving, turning. They plateau, so thrust is what closes the last gap."

  - title: "Propulsion"
    content: "Fans, propellers, thrusters and reaction wheels push a ship. They need rotation power (or fuel, for a thruster). Power is all-or-nothing, so split big banks across networks."

  - title: "Mounting Matters"
    content: "Where a block points decides what it does. Facing fore/aft = speed. Sideways = turning. Up or down = lift. A reaction wheel always turns, whichever way it sits."

  - title: "Flying Heavy"
    content: "You do not need glowstone to fly. Enough upward thrust lifts any hull. Below 100% lift you cannot climb and you sink, faster the more lift you lack. Watch your fuel."

  - title: "Gluing"
    content: "A Glue Brush (brush + slimeball) adds blocks a ship normally cannot carry, like dirt or stone. While a session is open and you hold the brush, you cannot break blocks."

  - title: "Locking"
    content: "The lock freezes which cells are yours, so blocks piled against a docked hull are not swallowed on the next assemble. Broken cells are dropped; re-freeze to take them back."
