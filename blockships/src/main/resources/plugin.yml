name: BlockShips
main: anon.def9a2a4.blockships.BlockShipsPlugin
version: ${version}
api-version: 1.21
author: def9a2a4
description: Rideable display entity ships with collision and persistence.
softdepend: [ProtocolLib, WorldGuard]

commands:
  blockships:
    description: BlockShips plugin commands
    usage: /blockships help

permissions:
  blockships.info:
    description: Allows viewing ship and wheel statistics
    default: true
  blockships.reload:
    description: Allows reloading the plugin configuration
    default: op
  blockships.give:
    description: Allows giving ship kits (and spawning special drowned)
    default: op
  blockships.recipes:
    description: Allows unlocking recipes for players
    default: op
  blockships.admin:
    description: Allows admin commands (forcedisassembleall, killentities)
    default: op
  blockships.dismount:
    description: Allows force-dismounting from ships
    default: true
  blockships.highlight:
    description: Allows the highlightseats/highlightcolliders debug commands
    default: op
