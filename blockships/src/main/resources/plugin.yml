name: BlockShips
main: anon.def9a2a4.blockships.BlockShipsPlugin
version: ${version}
api-version: 1.21
author: def9a2a4
description: Rideable display entity ships with collision and persistence.
softdepend: [ProtocolLib]

commands:
  blockships:
    description: BlockShips plugin commands
    usage: |
      /blockships help - Show help and list all commands
      /blockships info - Show ship and wheel statistics
      /blockships dismount - Force-dismount from a ship
      /blockships highlightseats - Highlight seats on the ship you are looking at
      /blockships highlightcolliders - Toggle glowing on collider shulkers
      /blockships reload - Reload the plugin configuration
      /blockships give <item> - Give yourself a ship wheel or ship kit
      /blockships spawndrowned - Spawn a special drowned at your location
      /blockships recipes [player] - Unlock all BlockShips recipes
      /blockships forcedisassembleall - Force-disassemble all assembled ships
      /blockships killentities - Remove all BlockShips entities from worlds

permissions:
  blockships.reload:
    description: Allows reloading the plugin configuration
    default: op
  blockships.give:
    description: Allows giving ship kits
    default: op
  blockships.recipes:
    description: Allows unlocking recipes for players
    default: op
  blockships.admin:
    description: Allows admin commands (forcedisassembleall, killentities)
    default: op
  blockships.dismount:
    description: Allows force-dismounting from ships
    default: true
