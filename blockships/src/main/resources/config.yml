# Bumped by ConfigMigration when a shipped default changes. Do not edit by hand.
# Keep in step with ConfigMigration.CURRENT_VERSION: a fresh install already HAS every current default,
# so shipping a lower number here just makes the plugin re-save this file on its first boot for nothing.
config-version: 2

# BlockShips Plugin Configuration

# Set to false to stop the startup warning about a config/ override drifting behind the bundled
# defaults. It does NOT silence warnings about files the plugin cannot read or is not reading at all
# - those mean your edits are being ignored, which you always want to hear about.
warn-config-mismatch: true

# ---------------------------------------------------------------------------
# Customizing blocks.yml, items.yml and the prefab ship models
#
# These are NOT written to this folder. They are read from inside the plugin
# jar, so that every update ships current defaults (a copy extracted years ago
# would hide newly-supported blocks). To customize one, copy it out of the jar
# into a "config" subfolder next to this file:
#
#     plugins/BlockShips/config/blocks.yml
#
#     unzip -o BlockShips-*.jar blocks.yml -d plugins/BlockShips/config/
#
# A file at the plugin folder ROOT (plugins/BlockShips/blocks.yml) is IGNORED.
#
# An override REPLACES the bundled file - the two are not merged. Copy the
# whole file rather than writing a fragment, and re-check it after plugin
# updates; the startup log warns when yours is missing entries the bundled
# default has.
#
# This file (config.yml) works the other way round: it IS read from disk, from
# the plugin folder root, right here. A copy under config/ is read by nothing.
# ---------------------------------------------------------------------------


# Integrations with other plugins
plugins:
  worldguard:
    # Respect WorldGuard region build permissions (only active if WorldGuard is installed).
    # Disassembly: blocks landing in a protected region you can't build in DROP as items instead of
    #   being placed (you'll be warned first; Force Disassemble still works and drops them).
    # Assembly / wheel placement / wheel & engine breaking: denied inside a protected region.
    # Members, ops, and anyone with WorldGuard bypass are unaffected.
    enabled: true
    # What happens when an UNATTENDED ship (combat/crash death, or /blockships forcedisassembleall)
    # would place blocks into a protected region. Player-driven Force Disassemble always respects the
    # acting player's own build permission and ignores this setting.
    #   drop-items    (default) blocks drop as items - never written into the region (no grief)
    #   place-anyway            blocks are written into the region anyway (pre-integration wreck behavior)
    system-disassembly-in-region: drop-items

# Special Drowned Configuration
# These rare drowned mobs drop ship wheels when killed
special-drowned:
  # Enable/disable the feature
  enabled: true
  # Chance (0.0-1.0) that a naturally spawning drowned becomes special
  spawn-chance: 0.02
  # Base64-encoded texture for the custom head they wear
  head-texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZTcwYzY5NjJlZWE5ZDFjYjBiNTAzYWI3YjZiODFmYzUwNGI4YmQwMWY4YzQxNTYxZTBjMDIwYjZkMzY2YmQwMiJ9fX0="
  # Whether they hold a trident in main hand
  holds-trident: true
  # Ship wheel drop chance (1.0 = always drop)
  drop-chance: 1.0
  # Whether they spawn riding a nautilus (if available in server version)
  # On older servers without nautilus, gives Speed 1 instead
  rides-nautilus: true

# Recipe unlock settings
# When a player completes the specified advancement, all BlockShips recipes are unlocked
# Players who already have the advancement will receive recipes when they join
recipe-unlock:
  advancement: "minecraft:story/smelt_iron"  # "Acquire Hardware" advancement

# Custom block ships configuration (assembled from ship wheels)
custom-ships:
  collision-offset: [0.5, 0, 0.5]    # Additional offset for collision boxes
  assembly-nudge-height: 0.2  # Teleport nearby players up by this amount on assemble/disassemble (0 to disable)
  max-ship-size: 1000  # Maximum number of blocks in a custom ship
  max-scan-size: 5000  # Maximum blocks to scan when ship exceeds limit (for reporting actual size)

  # What happens when a custom ship is destroyed (health reaches 0)
  # "disassemble" - blocks are placed back into the world (default)
  # "destroy" - blocks are lost, stored items are dropped
  destruction-mode: disassemble

  # Buoyancy system - weight-based floating
  # Ships float based on their density (total weight / block count) compared to water density
  # - Density < water: floats higher (surface offset increases)
  # - Density = water: neutral (floats at water surface)
  # - Density > water: sinks lower (surface offset decreases, eventually sinks)
  buoyancy:
    # Reference density of air (ships lighter than this become airships)
    air-density: 0.0
    # Reference density of water (blocks.yml uses 0 to 4 weight scale for most blocks)
    # Ships with density = water-density float at their center of volume
    # Ships between air and water density interpolate between bottom and center
    water-density: 3
    # Buoyancy strength: how fast ship moves toward target height (0.05 = smooth, 0.2 = fast)
    strength: 0.05
    # Buoyancy damping: velocity damping to prevent oscillation (0.5 = stable)
    damping: 0.5

  # Ship stats (power-to-mass ratio system)
  # Sails provide power points; block weights provide mass.
  # ratio = power / mass determines ship performance.
  stats:
    # Master switch for the power-to-mass ratio system.
    # true  = custom ships scale speed/rotation by sails and mass (default)
    # false = custom ships ignore composition and use the fixed default stats below
    #         (sails become cosmetic; restores pre-stats behavior)
    # This was previously off "pending a rework of the stats system". That rework has landed — sail
    # tiers, propulsion blocks and the three-ratio model below — so it now defaults on. Existing
    # servers are upgraded once, and only if they never turned it on themselves.
    # Feedback on ship stats balance and functionality welcome: https://github.com/def9a2a4/BlockShips/issues/18
    enabled: true
    # Free power points every ship gets (ensures even tiny ships have some base ratio)
    base-power: 2
    # Power points per wool block used as sail
    wool-power: 3
    # Power points per banner block used as sail
    banner-power: 7
    # Power points per LARGE / HUGE banner (defCoreLib bbanners). These are display entities attached
    # to a host block rather than blocks of their own, so they are found by an entity query, not by
    # material. Worth much more than a plain banner — roughly by rendered area.
    large-banner-power: 20
    huge-banner-power: 50
    # Performance is three independent ratios, not one:
    #   forward = capped sails + thrust pointing along the hull   -> speed, acceleration
    #   turn    = thrust across the hull + gyroscopes, plus sails scaled by current speed
    #             (a rudder needs flow)                           -> turn rate
    #   lift    = thrust pointing down, against SIGNED weight     -> flight
    # Sails still plateau at sail-cap-ratio, so propulsion is what closes the last gap.
    #
    # Free turning points every ship gets, so a bare hull can still steer a little.
    base-turn: 2
    # How much sail power aids turning. Multiplied by current speed / top speed, so sails do nothing
    # for a stationary ship — that is what reaction wheels and side thrusters are for.
    sail-turn-factor: 0.5
    # Ticks for thrust to ramp UP from cold. Rotation power is all-or-nothing, so without this an engine
    # running dry would cut every propeller in the same tick and drop a flying ship like a stone.
    # Spooling DOWN is not the same length: the step scales with the current thrust, so it decays rather
    # than ramping, and a big propeller bank takes several times this to reach zero (at 40, a 250-thrust
    # bank needs about 259 ticks). That is intended — raise this to glide longer, lower it to stop harder.
    thrust-spool-ticks: 40
    # ── Flight ────────────────────────────────────────────────────────────────────────────────────
    # Two separate questions, deliberately kept apart:
    #   "can it hold itself up?"  -> lift = downward thrust vs SIGNED weight. 1.0 = neutral.
    #                                Below 1.0 you cannot climb at all; how far below sets fall speed.
    #                                A lighter-than-air hull starts at 1.0 for free.
    #   "how fast does it move up/down?" -> the vertical ratio: buoyancy + sails + vertical thrust.
    # So lift decides WHETHER you fly, the vertical ratio decides HOW FAST — a heavy helicopter can
    # have a high ceiling and no permission to use it, and a balloon gains speed from adding fans.
    #
    # How fast a ship falls when it cannot hold itself up. Sink rate is
    # max-sink-speed * (1 - lift)^sink-speed-exponent, so it is driven by how much lift is MISSING.
    # 0.5 = 10 blocks/sec at zero lift. Values above 0.08 / (1 - vertical-drag) = 0.8 do nothing,
    # because vertical drag becomes the limit first and the curve flattens out.
    max-sink-speed: 0.5
    # Shape of that curve. BELOW 1.0 makes a small shortfall immediately noticeable while keeping the
    # badly-under-powered end well spread out; above 1.0 forgives near-misses and lumps everything
    # worse than about half lift into one plummet. At 0.7: lift 0.99 drifts down at 0.4 blocks/sec,
    # 0.9 sinks at 2, 0.5 at 6, 0 falls at 10 — every step stays distinguishable.
    # (Note this runs OPPOSITE to the old lift-falloff-exponent it replaces: raising this is gentler.)
    sink-speed-exponent: 0.7
    # Holding Space with less than 1.0 lift cannot gain altitude — it points what thrust there is
    # downward and slows the fall to this fraction of its free rate. Scaled by how much lift you have,
    # so a ship with none gets no help at all.
    lift-hold-sink-factor: 0.35
    # Only SURPLUS lift climbs. Lift this far above 1.0 earns the full vertical speed; less climbs
    # proportionally slower, and lift at or below 1.0 holds altitude but never gains any. Scales the
    # ceiling rather than the acceleration, so a marginal ship still feels responsive — it just does
    # not go anywhere fast.
    climb-surplus-full: 0.25
    # How much sail power feeds vertical SPEED (not lift). Sails catching air is what makes a rigged
    # airship rise faster than a bare one; it never lets a heavy hull fly, since that is lift's job.
    sail-vertical-factor: 0.5
    # Thrust points per defCoreLib propulsion block, counted only while the block is actually powered
    # (or, for the thruster, burning). Which stat a block feeds depends on how it is mounted: along
    # the hull adds speed, across it adds turn rate, and flat adds lift. A reaction wheel always feeds
    # turn rate whichever way it sits.
    #
    # Scale: these are compared against block WEIGHT (blocks.yml), where oak is 2. A huge propeller at
    # 250 therefore lifts roughly a 125-block oak hull on its own — that is the "helicopter" budget,
    # and it is what makes a heavier-than-air flier buildable rather than theoretical.
    #
    # KEEP IN SYNC with ShipThrust.DEFAULT_THRUST. These are read as
    # getConfig().getInt(path, DEFAULT_THRUST), so whatever is written here WINS and the Java defaults
    # only apply to a config that predates the key. Changing one and not the other means a fresh
    # install and an upgraded server quietly play different games.
    thrust:
      fan: 10
      propeller: 32
      large-propeller: 100
      huge-propeller: 250
      thruster: 50
      reaction-wheel: 10
    # Sail contribution capped at this ratio
    sail-cap-ratio: 0.8
    # Ratio that maps to current default stats (0.55 max speed, 1.5 rotation, etc.)
    default-ratio: 0.7
    # Stats multiplier at ratio 1.0 relative to default (1.5 = 50% faster than default)
    max-ratio-multiplier: 1.5
    # Absolute floors (minimum stat values regardless of ratio)
    floor-max-speed: 0.05           # 1 block/sec
    floor-acceleration: 0.015
    floor-rotation-speed: 0.6       # 30s per full revolution
    floor-rotation-acceleration: 0.05
    floor-rotation-deceleration: 0.05
    # Absolute caps (-1 = auto: default * max-ratio-multiplier)
    cap-max-speed: -1
    cap-acceleration: -1
    cap-rotation-speed: -1
    cap-rotation-acceleration: -1
    cap-rotation-deceleration: -1
    # Airship vertical stat scaling (density magnitude)
    vertical-density-scale: 0.3
    floor-max-vertical-speed: 0.03
    floor-vertical-acceleration: 0.01
    cap-max-vertical-speed: 0.5
    cap-vertical-acceleration: 0.1

  # Airship controls (for custom ships lighter than air)
  # Ships with density < air-density automatically become airships
  airship-controls:
    # Vertical acceleration when pressing Space (lift) or Sprint (descend)
    lift-acceleration: 0.05
    descend-acceleration: 0.05
    # Maximum vertical speed in blocks per tick
    max-vertical-speed: 0.3
    # Vertical drag when not pressing vertical controls (0.9 = slow descent, 1.0 = no drag)
    vertical-drag: 0.9
    # Small forward nudge during vertical movement to ensure movement detection
    vertical-forward-nudge: 0.011

# Global physics settings
physics:
  # Deck physics velocity thresholds
  # Minimum velocity magnitude to transfer to players standing on deck (prevents jitter)
  deck-physics-min-velocity: 0.1
  # Maximum velocity magnitude to transfer (prevents velocity spikes from bugs)
  deck-physics-max-velocity: 10.0

  # Idle detection settings
  # Number of ticks to wait before stopping the update task when ship is idle
  idle-ticks-before-stop: 10
  # How often (in ticks) to check for movement when ship is idle
  idle-check-interval: 10
  # Minimum movement (blocks/tick) required to update armor stands and displays
  movement-threshold: 0.001
  # Minimum rotation (degrees) required to update armor stands and displays
  rotation-threshold: 0.001
  # Fallback radius in blocks for carrying riders up when a ship's collision radius is not yet known
  player-proximity-radius: 2.0
  # Display entity transform interpolation duration in ticks (1-4, default: 2)
  # Controls rotation/scale smoothing. Position follows vehicle instantly.
  display-interpolation-duration: 2
  # Extra position sync packets for smoother ship visuals (requires ProtocolLib)
  # Sends vehicle position every tick instead of every 3 ticks
  position-sync-enabled: true
  # Minimum speed (blocks/tick) to send extra position sync packets (default: 0.02)
  # Below this threshold, packets are not sent to avoid jitter on stationary ships
  position-sync-threshold: 0.02

# Cannon system configuration
cannons:
  # Cooldown between cannon fires in milliseconds (per cannon)
  cooldown-ms: 1000
  # Whether TNT can be fired from ship cannons (disabled by default to prevent griefing)
  tnt-enabled: false
  # Fuse time in ticks for TNT fired from cannons (vanilla default: 80 ticks = 4 seconds)
  tnt-fuse-ticks: 80

# Sound settings (global volume multipliers)
sounds:
  # Volume multiplier for ship damage sounds (0.0 = disabled, 1.0 = normal)
  damage-volume: 0.1
  # Volume multiplier for movement sounds - boat paddle and elytra whoosh (0.0 = disabled, 1.0 = normal)
  movement-volume: 0.5
  # Volume multiplier for cannon fire sounds (0.0 = disabled, 1.0 = normal)
  cannon-volume: 0.35
  # Volume multiplier for lead break sounds (0.0 = disabled, 1.0 = normal)
  lead-break-volume: 1.0
  # Volume multiplier for ship-to-ship collision sounds (0.0 = disabled, 1.0 = normal)
  ship-collision-volume: 0.15

# Ship-to-ship collision settings (global)
collision:
  # Enable/disable ship-to-ship collision detection (disable for performance on busy servers)
  ship-to-ship-enabled: true
  # Maximum number of collider overlaps to process per ship pair (early exit for performance)
  ship-to-ship-max-collisions: 20

# Entity masses for collision physics (global settings)
entity-masses:
  boat: 10.0         # Boats, minecarts
  mob-small: 5.0     # Chickens, rabbits, bats
  mob-medium: 10.0    # Players, zombies, cows, horses
  mob-large: 20.0    # Iron golems, wardens, ravagers

# Custom items (intermediate crafting ingredients)
custom-items:
  balloon:
    display-name: "{VARIANT} Ship Balloon"
    base-material: PLAYER_HEAD
    texture-set: BALLOONS
    variant-source: WOOL
    stackable: false
    recipe:
      pattern:
        - "WWW"
        - "WMW"
        - "WWW"
      ingredients:
        W: ["*_WOOL"]
        M: [GLOWSTONE]
      result-name: "{VARIANT} Ship Balloon"
      result-item: PLAYER_HEAD
      result-texture-set: BALLOONS

  ship_wheel:
    display-name: "Ship Wheel"
    base-material: PLAYER_HEAD
    texture-set: SHIP_WHEEL_SET
    variant-source: GOLD_BLOCK
    stackable: false
    recipe:
      pattern:
        - " C "
        - "CGC"
        - "MCL"
      ingredients:
        C: [COPPER_INGOT]
        G: [GOLD_INGOT]
        M: [COMPASS]
        L: [LEAD]
      result-name: "Ship Wheel"
      result-item: PLAYER_HEAD
      result-texture-set: SHIP_WHEEL_SET

  # (The old `ship_engine` item lived here. The experimental ship-engine subsystem was removed, and
  # the item outlived it as a craftable blast furnace that nothing read. Propulsion now comes from
  # defCoreLib's rotation blocks — propellers, thrusters and reaction wheels.)

  captains_manual:
    display-name: "Captain's Manual"
    base-material: WRITTEN_BOOK
    stackable: false
    recipe:
      shapeless: true
      ingredients:
        W: ["blockships:ship_wheel"]
        B: [BOOK]
      result-name: "Captain's Manual"
      result-item: WRITTEN_BOOK

# list of ships
ships:
  smallship:
    # Path to the ship model YAML file
    model-path: prefab_ships/ship_small.yml

    # Crafting recipe for this ship type
    recipe:
      # 3x3 shaped crafting pattern (each string is a row)
      pattern:
        - "PBP"
        - "PCP"
        - "PCP"
      # Ingredient definitions (letter -> list of valid materials)
      # Use wildcards like "*_PLANKS" or "*_BANNER" to match all variants
      ingredients:
        P: ["*_PLANKS"]
        B: ["*_BANNER"]
        C: [CHEST]
      # Ship kit item customization
      # Use {WOOD_TYPE} as a template variable (e.g., "Small {WOOD_TYPE} Ship Kit" -> "Small Oak Ship Kit")
      result-name: "{WOOD_TYPE} Small Ship Kit"
      # Item type for ship kit (can be PLAYER_HEAD, PAPER, or any item)
      result-item: PLAYER_HEAD
      # Reference to texture set defined in items.yml (e.g., CRATES, BALLOONS)
      result-texture-set: CRATES

    # Set to true to make collision boxes glow (useful for debugging)
    collision-debug-glow: false

    controls:
      # Maximum forward speed in blocks per tick
      max-speed: 0.55
      # Speed increase per tick when accelerating (W key)
      acceleration: 0.02

      # Deceleration & drag rates
      # Active deceleration: Speed decrease per tick when pressing S (additive)
      active-deceleration: 0.025
      # Mounted drag: Speed multiplier when driver aboard but not pressing W/S (multiplicative)
      mounted-drag: 0.995
      # No-driver drag: Speed multiplier whenever nobody is driving (multiplicative).
      # Replaces the old unmanned-drag/idle-drag pair, which were selected by player proximity.
      no-driver-drag: 0.98
      # Minimum movement threshold: Below this speed, ship stops completely (prevents creeping)
      min-movement-threshold: 0.01

      # Rotation controls
      # Maximum rotation speed in degrees per tick when steering
      rotation-speed: 1.5
      # Rotation speed increase per tick when pressing A/D (for smooth turning)
      rotation-acceleration: 0.3
      # Rotation speed decrease per tick when no A/D input (momentum decay)
      rotation-deceleration: 0.15

      # Water buoyancy (spring-based floating)
      # Buoyancy strength: How strongly ship is pushed toward target float height (0.0-1.0)
      # Higher values = faster response to water surface
      buoyancy-strength: 0.05
      # Buoyancy damping: Velocity damping to prevent oscillation (0.0-1.0)
      # Higher values = less bouncing, more stable floating
      buoyancy-damping: 0.5

    # Health system configuration
    # Maximum health points (players see this as hearts on the health bar)
    max-health: 20.0
    # Health regeneration rate in HP per second (1.0 = 1 HP every second)
    health-regen-per-second: 1.0

    # Collision detection and physics
    collision:
      # Ship mass for collision physics (this ship type)
      mass: 100.0
      # Overall collision response strength multiplier
      response-strength: 1.0
      # Terrain collision force multiplier (how hard terrain pushes back)
      terrain-strength: 1.0
      # How much ship speed amplifies terrain collision force (1.0 = no scaling, 10.0 = 10x at max speed)
      terrain-speed-multiplier: 10.0
      # Minimum penetration depth to trigger collision response (blocks)
      min-penetration: 0.1
      # Collision force retention per tick (0.0-1.0, higher = slower decay, 1.0 = no decay)
      force-decay: 0.7

    # Third-person camera distance when riding (default: 4, range: 0-32)
    # Larger values zoom the camera out further for better visibility on large ships
    camera-distance: 4.0

  bigship:
    model-path: prefab_ships/ship_big.yml

    # Crafting recipe for this ship type (bigger ship = more materials)
    recipe:
      # 3x3 shaped crafting pattern (each string is a row)
      pattern:
        - "PBP"
        - "CPC"
        - "CCC"
      # Ingredient definitions (letter -> list of valid materials)
      # Use wildcards like "*_PLANKS" or "*_BANNER" to match all variants
      ingredients:
        P: ["*_PLANKS"]
        B: ["*_BANNER"]
        C: [CHEST]
      # Ship kit item customization
      # Use {WOOD_TYPE} as a template variable (e.g., "Small {WOOD_TYPE} Ship Kit" -> "Small Oak Ship Kit")
      result-name: "{WOOD_TYPE} Large Ship Kit"
      # Item type for ship kit (can be PLAYER_HEAD, PAPER, or any item)
      result-item: PLAYER_HEAD
      # Reference to texture set defined in items.yml (e.g., CRATES, BALLOONS)
      result-texture-set: CRATES

    collision-debug-glow: false

    controls:
      max-speed: 0.55
      acceleration: 0.02
      active-deceleration: 0.025
      mounted-drag: 0.995
      no-driver-drag: 0.98
      min-movement-threshold: 0.01

      rotation-speed: 1.5
      rotation-acceleration: 0.3
      rotation-deceleration: 0.15

      buoyancy-strength: 0.05
      buoyancy-damping: 0.5

    # Health system configuration
    max-health: 50.0
    health-regen-per-second: 1.0

    collision:
      mass: 100.0
      response-strength: 1.0
      terrain-strength: 2.0
      terrain-speed-multiplier: 10.0
      min-penetration: 0.1
      force-decay: 0.7

    # Third-person camera distance when riding (default: 4, range: 0-32)
    camera-distance: 8.0

  smallairship:
    type: airship
    model-path: prefab_ships/airship_small.yml

    recipe:
      pattern:
        - "BBB"
        - "PCC"
        - "PPP"
      ingredients:
        B: ["blockships:balloon"]  # Custom balloon items
        P: ["*_PLANKS"]
        C: [CHEST]
      result-name: "{WOOD_TYPE} Small Airship Kit"
      result-item: PLAYER_HEAD
      result-texture-set: CRATES

    collision-debug-glow: false

    controls:
      max-speed: 0.4
      acceleration: 0.015
      active-deceleration: 0.02
      mounted-drag: 0.995
      no-driver-drag: 0.98
      min-movement-threshold: 0.01

      rotation-speed: 1.2
      rotation-acceleration: 0.25
      rotation-deceleration: 0.15

      # Airship-specific controls
      lift-acceleration: 0.05
      descend-acceleration: 0.05
      max-vertical-speed: 0.3
      vertical-drag: 0.9
      vertical-forward-nudge: 0.011  # Small forward movement during vertical travel (must exceed movement-threshold)

    max-health: 25.0
    health-regen-per-second: 1.0

    collision:
      mass: 80.0
      response-strength: 1.0
      terrain-strength: 2.0
      terrain-speed-multiplier: 10.0
      min-penetration: 0.1
      force-decay: 0.7

    # Third-person camera distance when riding (default: 4, range: 0-32)
    camera-distance: 6.0

  custom:
    collision-debug-glow: false

